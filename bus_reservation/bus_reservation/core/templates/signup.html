{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form method="post" action="{% url 'signup' %}">
            {% csrf_token %}
            {% if form.errors %}
                <div class="error-message">
                    Please correct the errors below.
                </div>
            {% endif %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
            <p class="toggle"><a href="{% url 'login' %}">Already have an account? Login</a></p>
        </form>
    </div>
</body>
</html>
